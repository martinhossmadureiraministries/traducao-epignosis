name: CI

# Proposta de CI. Para ativar, copie este ficheiro para
# .github/workflows/ci.yml na UI do GitHub (o push de workflows exige a
# permissão `workflows`). Ver docs/OPERACAO.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testes principais
        run: python3 -m unittest discover -s tests -v
      - name: Integridade dos dados
        run: python3 scripts/verificar_dados.py --minimo 18
      - name: Coerência da documentação
        run: python3 scripts/verificar_documentacao.py
      - name: Workflow modelo e workflow ativo
        run: python3 -m unittest tests.test_workflow_sincronizado -v
