name: BEE — relógio de segurança

# Rede de segurança do agendador.
#
# Para que serve: o cron do workflow principal (bee-autopiloto.yml) pode não
# ser registado pelo GitHub. Foi o que aconteceu entre 16/11/2026 e 17/11/2026:
# o ficheiro esteve no `main` o dia inteiro, `state: active`, e o filtro
# `event=schedule` ficou a ZERO durante mais de cinco horas — enquanto o
# "Run workflow" manual funcionava à primeira. Um agendador que não dispara
# não se resolve com mais código de produção: acrescenta-se um segundo relógio,
# independente, que vigia o primeiro.
#
# Como funciona: de hora a hora (minuto 41), lê as últimas execuções da
# produção. Se nenhuma tiver começado nos últimos 65 minutos, despacha-a pela
# API (`workflow_dispatch`). Se a produção já correu, não faz nada — não duplica
# trabalho nem gasta quota da IA.
#
# Limite honesto: este relógio usa o MESMO mecanismo de cron do GitHub. Se o
# GitHub deixar de agendar os dois, a solução é o pinger externo descrito em
# docs/AGENDADOR.md (fase 3). Este ficheiro compra a redundância que é possível
# comprar sem contas externas.

on:
  schedule:
    # Minuto 41: 18 minutos depois da produção (minuto 23), para não haver
    # dúvida sobre se a execução daquela hora já apareceu.
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  # `actions: write` é o que permite despachar o outro workflow com o
  # GITHUB_TOKEN; `contents: read` chega para ler o repositório.
  actions: write
  contents: read

concurrency:
  group: bee-relogio
  cancel-in-progress: false

jobs:
  vigiar:
    name: Ver se a produção está viva
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Contar as execuções da produção na última hora
        id: visto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          limite=$(date -u -d '65 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "A contar execuções da produção desde $limite (UTC)."
          if ! json=$(gh api "repos/$REPO/actions/workflows/bee-autopiloto.yml/runs?per_page=20"); then
            {
              echo "### Relógio: não consegui ler as execuções"
              echo "A API recusou a leitura. Confirme em Settings → Actions → General que o token do repositório pode ler execuções."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "corridas=erro" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          corridas=$(printf '%s' "$json" | python3 -c \
            'import json, sys; d = json.load(sys.stdin); print(sum(1 for r in d["workflow_runs"] if r["created_at"] > sys.argv[1]))' \
            "$limite")
          echo "Execuções da produção nos últimos 65 min: $corridas" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "corridas=$corridas" >> "$GITHUB_OUTPUT"

      - name: Despachar a produção, se ela estiver parada
        if: steps.visto.outputs.corridas == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if gh workflow run bee-autopiloto.yml --repo "$REPO"; then
            {
              echo "### Relógio: produção despachada"
              echo "A produção não corria há mais de 65 min; este relógio chamou-a."
              echo "Se isto acontecer em todas as horas, o cron da produção não está a ser registado: ver docs/AGENDADOR.md, fase 3 (pinger externo)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Relógio: não consegui despachar a produção"
            echo "O GitHub recusou \`gh workflow run\`. Verifique a permissão \`actions: write\` neste ficheiro e, em Settings → Actions → General, se os workflows podem ser despachados."
            echo "Alternativa imediata: Run workflow manual, e depois o pinger externo de docs/AGENDADOR.md."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Registar que a produção está viva
        if: steps.visto.outputs.corridas != '0'
        run: |
          echo "A produção correu nos últimos 65 min. Nada a fazer." >> "$GITHUB_STEP_SUMMARY"
