# PROPOSTA PARA A ETAPA 1 — copiar para `modelos/bee-autopiloto.yml` e para
# `.github/workflows/bee-autopiloto.yml` (têm de ficar iguais). O GitHub recusa
# o push de ficheiros em `.github/workflows/` quando a integração não tem a
# permissão `workflows`; por isso a alteração viaja aqui até ser aplicada.
name: BEE — produção automática

# Modelo de produção automática na nuvem (GitHub Actions).
#
# Este ficheiro vive em modelos/ e o ativo em .github/workflows/bee-autopiloto.yml;
# têm de ser IGUAIS (o teste test_modelo_e_workflow_ativo_sao_iguais vigia isto).
# Ao alterar um, copie-o para o outro no mesmo commit. Ver AUTOMACAO.md, secção 4.
#
# Cada execução produz um bloco pequeno de versículos e termina. É o agendador
# do GitHub que volta a chamar o trabalho, por isso a produção continua mesmo
# com o seu computador desligado. Se a sua conta não tiver minutos de Actions
# gratuitos, desative o workflow e use `autopiloto.py --horas 6` localmente.

on:
  schedule:
    # A cada 20 minutos, a começar fora da hora cheia.
    # Repositório público = minutos de Actions ilimitados, por isso o que conta
    # é a quota da IA, não o orçamento de minutos.
    # Duas armadilhas do cron do GitHub que já nos custaram horas de produção:
    #   * o minuto 0 é o mais congestionado (execuções em atraso ou perdidas);
    #   * um cron '*/15' perde o alinhamento por horas quando o GitHub atrasa.
    # '7,27,47' mantém sempre o mesmo compasso.
    - cron: '7,27,47 * * * *'
  pull_request:
    # Permite despachar a produção a partir deste PR ("Run workflow").
    types: [labeled]
  workflow_dispatch:
    inputs:
      pular_teste:
        description: 'Saltar o teste das ligações (sim/nao)'
        required: false
        default: 'nao'
      versos_por_ciclo:
        description: 'Versículos a produzir nesta execução'
        required: false
        default: '80'
      livros:
        description: 'Só estes book_number (ex.: 640,500); vazio = fila das oito fases'
        required: false
        default: ''
      modelo:
        description: 'Forçar um modelo (vazio = o programa descobre o modelo livre na conta)'
        required: false
        default: ''

permissions:
  contents: write

# Nunca duas execuções a escrever nos mesmos dados ao mesmo tempo.
concurrency:
  group: bee-producao
  cancel-in-progress: false

env:
  BEE_BRAMO_DADOS: bee-dados
  BEE_FUSO: Africa/Luanda
  # O cron do GitHub corre em UTC e Angola também, por isso coincidem.
  # BEE_HORA_INICIO/FIM em UTC; BEE_JANELA=0 desliga a janela interna para
  # não haver duas réguas diferentes. 24 horas por dia: com minutos ilimitados
  # não há razão para parar de madrugada.
  BEE_HORA_INICIO: '0'
  BEE_HORA_FIM: '24'
  BEE_JANELA: '0'
  # 240 versículos por execução: o arranque (checkout, python, cache) custa
  # ~1 min fixo. Com minutos ilimitados, blocos maiores rendem mais por
  # execução e reduzem o número de arranques.
  BEE_VERSOS_POR_CICLO: ${{ github.event.inputs.versos_por_ciclo || '80' }}
  BEE_LIVROS: ${{ github.event.inputs.livros }}
  BEE_MODELO: ${{ github.event.inputs.modelo }}
  # 6 versículos por pedido. Os 10 que aqui estiveram em 17/11 produziram JSON
  # cortado (o Gemini não fechou a resposta) e HTTP 413 na Groq. 6 é o maior
  # lote que os dois serviços aceitam de forma consistente; o programa continua
  # a dividir sozinho se uma resposta vier truncada.
  BEE_LOTE: '6'
  # 2 tentativas por execução: um 5xx pode recuperar com uma nova tentativa,
  # mas não se insiste durante meia hora. O cron volta em 20 min.
  BEE_TENTATIVAS_CICLO: '2'
  BEE_ESPERA_ENTRE_TENTATIVAS: '15'
  BEE_TENTATIVAS: '2'
  # Prazo interno do ciclo (segundos). Deixa 3 min de margem para compilar,
  # exportar, publicar e carregar os artefactos dentro dos 12 min do job.
  BEE_TEMPO_MAXIMO: '540'
  BEE_TEMPO_TOTAL: '660'
  BEE_TIMEOUT: '90'
  # Teto GLOBAL de pedidos por dia (soma dos serviços). Cada serviço tem também
  # o seu próprio tecto, calculado a partir da quota real: a Groq está limitada
  # a ~66 pedidos/dia por causa dos 200.000 tokens/dia do plano gratuito. O
  # Gemini fica com os 480 dele quando a Groq esgota.
  BEE_PEDIDOS_POR_DIA: '500'
  # Quem abre a fila. O Gemini tem a maior quota diária gratuita (~480
  # pedidos) e é rápido; a Groq fica como reserva (~66 pedidos/dia). Para
  # inverter, mude para 'groq'.
  BEE_PROVEDOR_PRINCIPAL: 'gemini'
  # Só estes dois entram na fila. Uma chave esquecida no ambiente não deve
  # acrescentar OVHcloud/OpenRouter/Cerebras a uma produção que não os usa.
  BEE_PROVEDORES: 'gemini,groq'
  # A OVHcloud anónima é opt-in: sem isto, não entra na fila.
  OVH_API_KEY_ATIVO: '0'
  BEE_VERSOS_POR_DIA: '0'
  BEE_PROVEDOR: auto
  PYTHONUNBUFFERED: '1'

jobs:
  produzir:
    # Só quando despachado à mão ou com a etiqueta bee-producao num PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'bee-producao')
    runs-on: ubuntu-latest
    # 12 min: MENOS do que o intervalo do cron (20 min). O ciclo interno pára
    # aos 9 min (BEE_TEMPO_MAXIMO) para ainda haver tempo de compilar,
    # publicar e carregar artefactos. Antes eram 50 min: a execução ficava
    # presa em Retry-After de 20 minutos e era cancelada sem publicar.
    timeout-minutes: 12
    steps:
      - name: Obter o código
        uses: actions/checkout@v7
        with:
          # Num evento de PR (com a etiqueta bee-producao) usa-se o ramo do PR;
          # nas execuções agendadas usa-se o ramo por omissão.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
          fetch-depth: 0
          persist-credentials: true

      - name: Recuperar o progresso do ramo de dados
        run: |
          rm -rf /tmp/bee-remoto
          if git fetch origin "$BEE_BRAMO_DADOS" --depth=1 2>/dev/null; then
            git worktree add --detach /tmp/bee-remoto FETCH_HEAD >/dev/null 2>&1
            echo "Progresso recuperado do ramo $BEE_BRAMO_DADOS (o código não é alterado)."
          else
            echo "Ramo de dados ainda não existe; a começar do zero."
            mkdir -p /tmp/bee-remoto
          fi
          ls livros_json | head -20

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Reutilizar as fontes originais (~22 MB)
        uses: actions/cache@v6
        with:
          path: .bee-cache
          key: bee-fontes-sha256-v1

      # Fora da janela não se gasta tempo nem minutos de Actions: o trabalho
      # termina de imediato e o resumo diz que está tudo bem.
      - name: Verificar a janela de produção
        if: github.event_name == 'schedule'
        id: janela
        run: |
          # Janela de 24 h (0 a 24): não há nada para verificar. Tratar "24"
          # como hora compara-o com 00 e fecharia a janela o dia inteiro.
          if [ "$BEE_HORA_INICIO" = "0" ] && [ "$BEE_HORA_FIM" = "24" ]; then
            echo "Produção a 24 horas (minutos ilimitados)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "dentro=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hora=$(date -u +%H)
          if [ "$hora" -lt "$BEE_HORA_INICIO" ] || [ "$hora" -ge "$BEE_HORA_FIM" ]; then
            echo "Fora da janela ($hora UTC): a produção retoma às ${BEE_HORA_INICIO}:00 UTC." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "dentro=false" >> "$GITHUB_OUTPUT"
          else
            echo "dentro=true" >> "$GITHUB_OUTPUT"
          fi

      # Passo 0: perguntar a cada serviço se responde, antes de produzir.
      # Sem isto, um endpoint novo só se revela partido ao fim de 20 minutos
      # de trabalho — e o erro aparece como "resposta inválida", que esconde
      # a causa. Uma chave em falta deixava de ser visível.
      - name: Testar as ligações (não produz nada)
        if: github.event.inputs.pular_teste != 'sim'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python autopiloto.py --testar 2>&1 | tee /tmp/teste.txt || true
          {
            echo "### Teste das ligações"
            echo '```'
            cat /tmp/teste.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Produzir um bloco, compilar e publicar
        if: github.event_name != 'schedule' || steps.janela.outputs.dentro == 'true'
        env:
          BEE_REMOTO: /tmp/bee-remoto/livros_json
          BEE_UNIR: '1'
          # BEE_PROVEDORES (acima) limita a fila a Gemini e Groq. Cada um tem
          # o seu orçamento diário: esgotar um não cala o outro. Chaves de
          # outros serviços, mesmo que existam, não entram.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python nuvem.py

      - name: Avisar se a produção falhou
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "### Diagnóstico rápido" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${GEMINI_API_KEY}${GROQ_API_KEY}" ]; then
            echo "- Nenhuma chave chegou ao trabalho: confirme os secrets GEMINI_API_KEY e GROQ_API_KEY. Sem eles não há provedor na fila." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Chaves presentes. Se o erro for HTTP 5xx, o serviço estava instável: o próximo ciclo tenta de novo." >> "$GITHUB_STEP_SUMMARY"
            echo "- Se for HTTP 404, o serviço retirou esse modelo: basta voltar a correr, o programa escolhe outro sozinho." >> "$GITHUB_STEP_SUMMARY"
            echo "- Se for HTTP 429, é o limite por minuto: o programa passa a outro modelo/provedor e volta a tentar no ciclo seguinte." >> "$GITHUB_STEP_SUMMARY"
          fi
          tail -n 25 livros_json/.bee/diario.md 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "- (ainda sem diário)" >> "$GITHUB_STEP_SUMMARY"

      # O ZIP com os dois módulos e o LEIA-ME é criado pelo próprio nuvem.py.

      - name: Guardar os módulos como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BEE-modulos-${{ github.run_number }}
          path: entregas/auto/
          if-no-files-found: ignore
          retention-days: 14

      # Um ficheiro HTML por capítulo produzido nesta execução: dá para ler e
      # verificar no telemóvel sem esperar pelo módulo compilado, que só recebe
      # capítulos completos e consecutivos.
      - name: Guardar os capítulos como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BEE-capitulos-${{ github.run_number }}
          path: entregas/capitulos/
          if-no-files-found: ignore
          retention-days: 14

      # Artifacts só se descarregam com sessão iniciada no GitHub; o release é
      # público, por isso os capítulos lá acumulados abrem em qualquer telemóvel.
      - name: Publicar os capítulos no release bee-previa
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          ficheiros=(entregas/capitulos/*.html)
          if [ ${#ficheiros[@]} -eq 0 ]; then
            echo "Sem capítulos novos nesta execução."
            exit 0
          fi
          gh release view "bee-previa" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "bee-previa" --repo "$GITHUB_REPOSITORY" \
                 --title "BEE — prévia (rascunho automático)" \
                 --notes "Um ficheiro HTML por capítulo gerado pelo autopiloto, para leitura e verificação no telemóvel. Conteúdo gerado por IA e NÃO revisto. Os módulos MyBible completos estão no artifact BEE-modulos de cada execução."
          gh release upload "bee-previa" "${ficheiros[@]}" --clobber --repo "$GITHUB_REPOSITORY"
