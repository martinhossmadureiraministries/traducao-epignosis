name: BEE — edição nova (produção automática)

# Produção AUTOMÁTICA da NOVA edição (voz de docs/ESTILO_BEE.md), totalmente
# ISOLADA da linha legada:
#   * perfil de voz ....... BEE_EDICAO=nova          (bee/perfil.py)
#   * dados/checkpoints ... edicoes/nova/livros_json (estado em <dados>/.bee/)
#   * artefactos .......... edicoes/nova/entregas/{auto,capitulos}
#   * publicação .......... release separado `bee-previa-nova`
# A linha legada (bee-autopiloto.yml) NÃO é tocada por este ficheiro.
#
# O repositório é público => minutos de Actions ilimitados. O único limite real
# é a QUOTA das APIs de IA (Gemini ~480 pedidos/dia; Groq ~66/dia como reserva).
# Por isso cada execução produz um bloco grande e termina; o relógio volta a
# chamar. Para dedicar toda a quota à edição nova, DESATIVE o workflow legado
# (Actions → bee-autopiloto → Disable) enquanto esta linha corre.
#
# Notas operacionais aprendidas com a linha legada:
#   * cron muito frequente é travado em silêncio pelo GitHub; 1x/hora funciona.
#     Minuto 41 (fora da hora cheia e longe do minuto 23 do legado).
#   * `schedule` só dispara a partir do ramo predefinido (main): após o merge.
#     Antes disso, use "Run workflow" (workflow_dispatch) escolhendo o ramo.
#   * O grupo de concorrência é PARTILHADO com o legado ('bee-producao') para
#     nunca haver duas execuções a publicar no `main` ao mesmo tempo.

on:
  schedule:
    - cron: '41 * * * *'
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pular_teste:
        description: 'Saltar o teste das ligações (sim/nao)'
        required: false
        default: 'nao'
      versos_por_ciclo:
        description: 'Versículos a produzir nesta execução'
        required: false
        default: '300'
      livros:
        description: 'Só estes book_number (ex.: 640,570); vazio = fila editorial'
        required: false
        default: ''
      modelo:
        description: 'Forçar um modelo (vazio = descobre o livre na conta)'
        required: false
        default: ''

permissions:
  contents: write

# Serializa com a linha legada: uma só produção a escrever no `main` de cada vez.
concurrency:
  group: bee-producao
  cancel-in-progress: false

env:
  # ---- Identidade da edição nova -------------------------------------------
  BEE_EDICAO: nova
  BEE_DADOS: edicoes/nova/livros_json
  BEE_SAIDA: edicoes/nova/entregas/auto
  # ---- Revisão por segunda IA (P2) -------------------------------------------
  # Sempre ligada na edição nova: cada capítulo fechado é revisto por UM PROVEDOR
  # DIFERENTE do autor. Proteções de quota: só os textos viajam no pedido (sem
  # comentários), em lotes de 40 versículos; o revisor devolve emendas mínimas,
  # e cada emenda passa pela porta de estilo antes de ser aplicada. Falhas do
  # revisor preservam o original. Use 'desligado' para dispensar numa corrida.
  BEE_REVISAO: sempre
  # ---- Restantes parâmetros (espelham a linha legada validada) -------------
  BEE_BRAMO_DADOS: main
  BEE_FUSO: Africa/Luanda
  BEE_HORA_INICIO: '0'
  BEE_HORA_FIM: '24'
  BEE_JANELA: '0'
  # Blocos grandes: os minutos são ilimitados; o que rende é produzir muito por
  # arranque (checkout/python/cache custam ~1 min fixo). O ciclo interno pára
  # aos 13 min para sobrar tempo de compilar, publicar e carregar artefactos.
  BEE_VERSOS_POR_CICLO: ${{ github.event.inputs.versos_por_ciclo || '300' }}
  BEE_LIVROS: ${{ github.event.inputs.livros }}
  BEE_MODELO: ${{ github.event.inputs.modelo }}
  # 6 versículos/pedido: maior lote aceite de forma consistente pelos dois
  # serviços gratuitos; o programa divide sozinho respostas truncadas.
  BEE_LOTE: '6'
  BEE_TENTATIVAS_CICLO: '2'
  BEE_ESPERA_ENTRE_TENTATIVAS: '15'
  BEE_TENTATIVAS: '2'
  BEE_TEMPO_MAXIMO: '780'
  BEE_TEMPO_TOTAL: '870'
  BEE_TIMEOUT: '90'
  # Teto GLOBAL diário; cada provedor tem ainda o seu teto próprio calculado da
  # quota real (Groq ~66/dia pelos 200.000 tokens/dia; Gemini ~480/dia).
  BEE_PEDIDOS_POR_DIA: '500'
  BEE_PROVEDOR_PRINCIPAL: 'gemini'
  # CALIBRAÇÃO DA VOZ: poucos provedores = voz mais constante. Vários modelos
  # têm "sotaques" diferentes e foi isso que espalhou o «vós» em 2 Tessalonicenses.
  # A 2026-11-20, com a voz aprovada e a memória v1.4 (protocolo + desempate
  # NA28) a viajar em todos os pedidos, a lista foi alargada: o Gemini continua
  # autor principal (BEE_PROVEDOR_PRINCIPAL) e os restantes entram como reserva
  # de tradução e, sobretudo, como REVISORES diferentes do autor
  # (bee/papeis.py). Provedor sem chave nos Secrets é ignorado
  # automaticamente — editar a lista não quebra nada. OpenAI fica de fora
  # (pago). OVH continua desligada.
  # (Cloudflare Workers AI ainda não suportado: exige CF_ACCOUNT_ID.)
  BEE_PROVEDORES: 'gemini,cerebras,openrouter,nvidia,cohere,mistral,groq'
  OVH_API_KEY_ATIVO: '0'
  BEE_VERSOS_POR_DIA: '0'
  BEE_PROVEDOR: auto
  PYTHONUNBUFFERED: '1'

jobs:
  produzir:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'bee-edicao-nova')
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Obter o código
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Preparar as pastas isoladas da edição nova
        run: |
          mkdir -p "$BEE_DADOS" "$BEE_SAIDA"
          echo "### Edição nova" >> "$GITHUB_STEP_SUMMARY"
          echo "- Perfil de voz: \`$BEE_EDICAO\` (docs/ESTILO_BEE.md)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dados/checkpoints: \`$BEE_DADOS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artefactos: \`$BEE_SAIDA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar os dados versionados desta edição
        # Barreira de integridade própria da edição nova; começa em 0 porque a
        # pasta pode estar vazia (fila arranca em Filemom, book 640).
        run: python3 scripts/verificar_dados.py --dados "$BEE_DADOS" --minimo 0

      - name: Reutilizar as fontes originais (~22 MB)
        uses: actions/cache@v6
        with:
          path: .bee-cache
          key: bee-fontes-sha256-v1

      - name: Testar as ligações (não produz nada)
        if: github.event.inputs.pular_teste != 'sim'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # Aceita os dois nomes: o da conta (OPENROUTER_KEY) e o da API.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.NVIDIA_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.MISTRAL_KEY }}
        run: |
          python autopiloto.py --testar --dados "$BEE_DADOS" 2>&1 | tee /tmp/teste.txt || true
          {
            echo "### Teste das ligações"
            echo '```'
            cat /tmp/teste.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Produzir um bloco, compilar e publicar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # Aceita os dois nomes: o da conta (OPENROUTER_KEY) e o da API.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.NVIDIA_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.MISTRAL_KEY }}
        run: |
          python nuvem.py

      - name: Avisar se a produção falhou
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.NVIDIA_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.MISTRAL_KEY }}
        run: |
          echo "### Diagnóstico rápido (edição nova)" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${GEMINI_API_KEY}${GROQ_API_KEY}${CEREBRAS_API_KEY}${OPENROUTER_API_KEY}${NVIDIA_API_KEY}${COHERE_API_KEY}${MISTRAL_API_KEY}" ]; then
            echo "- Nenhuma chave chegou ao trabalho: confirme os secrets GEMINI_API_KEY, GROQ_API_KEY, CEREBRAS_API_KEY, COHERE_API_KEY, OPENROUTER_KEY (ou OPENROUTER_API_KEY), NVIDIA_KEY (ou NVIDIA_API_KEY) e MISTRAL_API_KEY." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- HTTP 5xx: serviço instável; o próximo ciclo tenta de novo." >> "$GITHUB_STEP_SUMMARY"
            echo "- HTTP 404: modelo retirado; o programa escolhe outro sozinho." >> "$GITHUB_STEP_SUMMARY"
            echo "- HTTP 429: limite por minuto; passa a outro modelo/provedor e volta no próximo ciclo." >> "$GITHUB_STEP_SUMMARY"
          fi
          tail -n 25 "$BEE_DADOS/.bee/diario.md" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "- (ainda sem diário)" >> "$GITHUB_STEP_SUMMARY"

      # Porta obrigatória (P1): o próprio motor já recusa versículos derivados no
      # momento da geração (roda para outro provedor no mesmo lote e manda para
      # quarentena o que nenhum provedor limpar). Este passo AUDITA o que ficou
      # gravado e BLOQUEIA a execução se uma falha dura chegar aqui — nenhuma
      # regressão pode seguir discretamente para os módulos.
      - name: Verificar o estilo (porta obrigatória)
        if: always()
        run: |
          set +e
          python3 scripts/verificar_estilo.py --dados "$BEE_DADOS" | tee /tmp/estilo.txt
          codigo=$?
          {
            echo "### Guarda de estilo (edição nova)"
            echo '```'
            cat /tmp/estilo.txt
            echo '```'
            if [ "$codigo" -ne 0 ]; then
              echo "> 🛑 Falhas duras nos dados gravados (arcaísmos/hesitação)."
              echo "> A porta do motor deveria tê-las impedido; investigue antes de repetir a corrida."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$codigo"

      # Métricas de qualidade por provedor (P3): quem deriva mais da voz, quem é
      # mais revisto, ordem de confiança. Informativo; também atualiza o cache
      # `.bee/metricas.json` que `BEE_PRIORIDADES=metricas` usa para ordenar os
      # revisores (menos deriva revista primeiro).
      - name: Métricas por provedor (P3)
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 scripts/metricas_provedores.py --dados "$BEE_DADOS" | tee /tmp/metricas.txt
          {
            echo "### Métricas por provedor"
            echo '```'
            cat /tmp/metricas.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Verificar os pacotes
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sqlite3, tempfile, zipfile
          raiz = Path(os.environ['BEE_SAIDA'])
          modulos = sorted(raiz.glob('BEE-modulos-*.zip'))
          if not modulos:
              print('Sem pacote de módulos nesta execução (ainda sem capítulo completo).')
              raise SystemExit(0)
          with zipfile.ZipFile(modulos[-1]) as pacote:
              nomes = set(pacote.namelist())
              for nome in ('BEE.SQLite3', 'BEE.commentaries.SQLite3', 'LEIA-ME.txt'):
                  if nome not in nomes:
                      raise SystemExit(f'{modulos[-1].name}: falta {nome}')
              with tempfile.TemporaryDirectory() as pasta:
                  pacote.extract('BEE.SQLite3', pasta)
                  total = sqlite3.connect(Path(pasta) / 'BEE.SQLite3').execute(
                      'SELECT COUNT(*) FROM verses').fetchone()[0]
                  if not total:
                      raise SystemExit(f'{modulos[-1].name}: módulo sem versículos')
                  print(f'{modulos[-1].name}: {total} versículos.')
          PY

      - name: Guardar os módulos como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BEE-nova-modulos-${{ github.run_number }}
          path: |
            edicoes/nova/entregas/auto/BEE-modulos-*.zip
            edicoes/nova/entregas/auto/BEE-diagnostico-*.zip
            edicoes/nova/entregas/auto/RELATORIO.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Guardar os capítulos como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BEE-nova-capitulos-${{ github.run_number }}
          path: |
            edicoes/nova/entregas/auto/BEE-capitulos-*.zip
            edicoes/nova/entregas/capitulos/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar os capítulos no release bee-previa-nova
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          capitulos=(edicoes/nova/entregas/capitulos/*.html)
          pacotes=(edicoes/nova/entregas/auto/BEE-modulos-*.zip edicoes/nova/entregas/auto/BEE-capitulos-*.zip)
          if [ ${#capitulos[@]} -eq 0 ] && [ ${#pacotes[@]} -eq 0 ]; then
            echo "Sem capítulos nem pacotes novos nesta execução."
            exit 0
          fi
          gh release view "bee-previa-nova" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "bee-previa-nova" --repo "$GITHUB_REPOSITORY" \
                 --title "BEE — prévia da EDIÇÃO NOVA (rascunho automático)" \
                 --notes "Capítulos em HTML e pacotes ZIP da edição nova (voz ESTILO_BEE). Conteúdo gerado por IA e NÃO revisto. Não misturar com a prévia da linha legada (release bee-previa)."
          if [ ${#capitulos[@]} -gt 0 ]; then
            gh release upload "bee-previa-nova" "${capitulos[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          fi
          if [ ${#pacotes[@]} -gt 0 ]; then
            gh release upload "bee-previa-nova" "${pacotes[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          fi
